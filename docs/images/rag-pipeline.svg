<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="790" viewBox="0 0 1700 790" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="850" y="30" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Patient history retrieval (RAG) pipeline</text><rect x="40" y="50" width="1620" height="230" rx="12" fill="#f0fdf4" fill-opacity="0.35" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6 4"/><text x="54" y="74" font-size="15" font-weight="700" fill="#14532d">Indexing (job worker)</text><rect x="60" y="90" width="245" height="130" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="182.5" y="112" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">Upload</text><text x="182.5" y="132" font-size="12.5" fill="#14532d" text-anchor="middle">PDF, DOCX, text</text><text x="182.5" y="148" font-size="12.5" fill="#14532d" text-anchor="middle">scans and photos go to OCR first</text><rect x="327" y="90" width="245" height="130" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="449.5" y="112" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">Validate</text><text x="449.5" y="132" font-size="12.5" fill="#14532d" text-anchor="middle">magic-byte type and size check</text><text x="449.5" y="148" font-size="12.5" fill="#14532d" text-anchor="middle">no PDF JS or embedded files</text><text x="449.5" y="164" font-size="12.5" fill="#14532d" text-anchor="middle">zip-bomb check, optional ClamAV</text><rect x="594" y="90" width="245" height="130" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="716.5" y="112" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">Parse</text><text x="716.5" y="132" font-size="12.5" fill="#14532d" text-anchor="middle">PyMuPDF, python-docx, text</text><text x="716.5" y="148" font-size="12.5" fill="#14532d" text-anchor="middle">headings from font and styles</text><text x="716.5" y="164" font-size="12.5" fill="#14532d" text-anchor="middle">parsed blocks stored</text><rect x="861" y="90" width="245" height="130" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="983.5" y="112" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">Chunk</text><text x="983.5" y="132" font-size="12.5" fill="#14532d" text-anchor="middle">section-aware, about 900 chars</text><text x="983.5" y="148" font-size="12.5" fill="#14532d" text-anchor="middle">150 chars overlap by sentence</text><text x="983.5" y="164" font-size="12.5" fill="#14532d" text-anchor="middle">section, page, offsets kept</text><rect x="1128" y="90" width="245" height="130" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="1250.5" y="112" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">Embed</text><text x="1250.5" y="132" font-size="12.5" fill="#14532d" text-anchor="middle">potion-retrieval-32M (fastembed)</text><text x="1250.5" y="148" font-size="12.5" fill="#14532d" text-anchor="middle">L2-normalised float32</text><text x="1250.5" y="164" font-size="12.5" fill="#14532d" text-anchor="middle">text = type | section | body</text><rect x="1395" y="90" width="245" height="130" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="1517.5" y="112" font-size="14" font-weight="700" fill="#78350f" text-anchor="middle">Store</text><text x="1517.5" y="132" font-size="12.5" fill="#78350f" text-anchor="middle">document_chunks in the main DB</text><text x="1517.5" y="148" font-size="12.5" fill="#78350f" text-anchor="middle">chunker and model recorded</text><text x="1517.5" y="164" font-size="12.5" fill="#78350f" text-anchor="middle">stale versions re-embedded later</text><line x1="305" y1="155" x2="327" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="572" y1="155" x2="594" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="839" y1="155" x2="861" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="1106" y1="155" x2="1128" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="1373" y1="155" x2="1395" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="330" width="1620" height="430" rx="12" fill="#fdf4ff" fill-opacity="0.35" stroke="#d946ef" stroke-width="1.5" stroke-dasharray="6 4"/><text x="54" y="354" font-size="15" font-weight="700" fill="#701a75">Query time (per triage request, one patient only)</text><rect x="60" y="390" width="200" height="90" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="160.0" y="412" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Complaint</text><text x="160.0" y="432" font-size="12.5" fill="#0f172a" text-anchor="middle">free text from the nurse</text><text x="160.0" y="448" font-size="12.5" fill="#0f172a" text-anchor="middle">or a verified transcript</text><rect x="300" y="390" width="260" height="90" rx="8" fill="#fdf4ff" stroke="#d946ef" stroke-width="2"/><text x="430.0" y="412" font-size="14" font-weight="700" fill="#701a75" text-anchor="middle">Normalise and expand</text><text x="430.0" y="432" font-size="12.5" fill="#701a75" text-anchor="middle">abbreviations (SOB, MI, HTN)</text><text x="430.0" y="448" font-size="12.5" fill="#701a75" text-anchor="middle">lay terms to clinical terms</text><text x="430.0" y="464" font-size="12.5" fill="#701a75" text-anchor="middle">3 query variants</text><rect x="610" y="360" width="250" height="80" rx="8" fill="#fdf4ff" stroke="#d946ef" stroke-width="2"/><text x="735.0" y="382" font-size="14" font-weight="700" fill="#701a75" text-anchor="middle">Dense</text><text x="735.0" y="402" font-size="12.5" fill="#701a75" text-anchor="middle">best cosine across variants</text><text x="735.0" y="418" font-size="12.5" fill="#701a75" text-anchor="middle">only this patient&#x27;s chunks</text><rect x="610" y="470" width="250" height="80" rx="8" fill="#fdf4ff" stroke="#d946ef" stroke-width="2"/><text x="735.0" y="492" font-size="14" font-weight="700" fill="#701a75" text-anchor="middle">BM25</text><text x="735.0" y="512" font-size="12.5" fill="#701a75" text-anchor="middle">Okapi, collection-wide IDF</text><text x="735.0" y="528" font-size="12.5" fill="#701a75" text-anchor="middle">expansion terms weighted 0.6</text><rect x="910" y="410" width="230" height="80" rx="8" fill="#fdf4ff" stroke="#d946ef" stroke-width="2"/><text x="1025.0" y="432" font-size="14" font-weight="700" fill="#701a75" text-anchor="middle">Rank fusion</text><text x="1025.0" y="452" font-size="12.5" fill="#701a75" text-anchor="middle">Reciprocal Rank Fusion, k = 60</text><text x="1025.0" y="468" font-size="12.5" fill="#701a75" text-anchor="middle">optional reranker (off)</text><rect x="1190" y="410" width="210" height="80" rx="8" fill="#fdf4ff" stroke="#d946ef" stroke-width="2"/><text x="1295.0" y="432" font-size="14" font-weight="700" fill="#701a75" text-anchor="middle">Confidence gate</text><text x="1295.0" y="452" font-size="12.5" fill="#701a75" text-anchor="middle">best score vs calibrated</text><text x="1295.0" y="468" font-size="12.5" fill="#701a75" text-anchor="middle">threshold (0.183 cosine)</text><rect x="1440" y="360" width="200" height="110" rx="8" fill="#fdf4ff" stroke="#d946ef" stroke-width="2"/><text x="1540.0" y="382" font-size="14" font-weight="700" fill="#701a75" text-anchor="middle">Parent section</text><text x="1540.0" y="402" font-size="12.5" fill="#701a75" text-anchor="middle">whole section of the hit,</text><text x="1540.0" y="418" font-size="12.5" fill="#701a75" text-anchor="middle">compressed to a character</text><text x="1540.0" y="434" font-size="12.5" fill="#701a75" text-anchor="middle">budget around the hit</text><rect x="1440" y="520" width="200" height="100" rx="8" fill="#fdf4ff" stroke="#d946ef" stroke-width="2"/><text x="1540.0" y="542" font-size="14" font-weight="700" fill="#701a75" text-anchor="middle">LLM input</text><text x="1540.0" y="562" font-size="12.5" fill="#701a75" text-anchor="middle">passages D1..Dn plus</text><text x="1540.0" y="578" font-size="12.5" fill="#701a75" text-anchor="middle">structured facts, each</text><text x="1540.0" y="594" font-size="12.5" fill="#701a75" text-anchor="middle">claim must cite one</text><rect x="1190" y="560" width="210" height="100" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="1295.0" y="582" font-size="14" font-weight="700" fill="#854d0e" text-anchor="middle">Below threshold</text><text x="1295.0" y="602" font-size="12.5" fill="#854d0e" text-anchor="middle">no note sent to LLM</text><text x="1295.0" y="618" font-size="12.5" fill="#854d0e" text-anchor="middle">facts still sent</text><text x="1295.0" y="634" font-size="12.5" fill="#854d0e" text-anchor="middle">UI: no confident match</text><rect x="1440" y="650" width="200" height="80" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="1540.0" y="672" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">After the LLM</text><text x="1540.0" y="692" font-size="12.5" fill="#14532d" text-anchor="middle">each claim checked</text><text x="1540.0" y="708" font-size="12.5" fill="#14532d" text-anchor="middle">against its cited passage</text><line x1="260" y1="435" x2="300" y2="435" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="560" y1="420" x2="610" y2="400" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="560" y1="450" x2="610" y2="510" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="860" y1="400" x2="910" y2="435" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="860" y1="510" x2="910" y2="465" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="1140" y1="450" x2="1190" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="1400" y1="435" x2="1440" y2="420" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="1404" y="445" width="27.200000000000003" height="18" fill="#ffffff" fill-opacity="0.9"/><text x="1408" y="458" font-size="12" font-weight="600" fill="#334155">yes</text><line x1="1540" y1="470" x2="1540" y2="520" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="1295" y1="490" x2="1295" y2="560" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="1299" y="515" width="20.8" height="18" fill="#ffffff" fill-opacity="0.9"/><text x="1303" y="528" font-size="12" font-weight="600" fill="#334155">no</text><line x1="1540" y1="620" x2="1540" y2="650" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><polyline points="1517,220 1517,305 735,305 735,360" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="900" y="296" width="330" height="18" fill="#ffffff"/><text x="905" y="310" font-size="12" font-weight="600" fill="#334155">chunks of this patient only (WHERE patient_id)</text></svg>